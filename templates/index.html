<!DOCTYPE html>
<html lang="pt-BR" data-color-scheme="dark" style="color-scheme: dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script>try { if (localStorage.getItem("wecal-sidebar-collapsed") === "true") document.documentElement.dataset.sidebarCollapsed = "true"; } catch (_) {}</script>
  <meta name="theme-color" content="#0b1418"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/assets/icon-192.png"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>WeCal — Sua agenda a dois</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%23102329'/%3E%3Crect x='4' y='4' width='4' height='4' rx='1' fill='%2352d6cd'/%3E%3Crect x='10' y='4' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='16' y='4' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='4' y='10' width='4' height='4' rx='1' fill='%2374e4da'/%3E%3Crect x='10' y='10' width='4' height='4' rx='1' fill='%2352d6cd'/%3E%3Crect x='16' y='10' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='4' y='16' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='10' y='16' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='16' y='16' width='4' height='4' rx='1' fill='%2374e4da'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"/>

  <!-- HTMX + Tailwind -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81'
            }
          },
          fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <!-- FullCalendar v7 (MIT) via CDN — bundle global, sem bundler -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/all/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/locales/pt-br/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/global.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/skeleton.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/theme.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/palettes/purple.css"/>

  <style>
    /* FullCalendar v7 has hashed classes; theme its public custom properties. */
    #calendar {
      min-width: 0;
      width: 100%;
      font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      --fc-monarch-primary: #52d6cd;
      --fc-monarch-primary-foreground: #082a2b;
      --fc-monarch-primary-over: #68e0d8;
      --fc-monarch-primary-down: #46c4bc;
      --fc-monarch-secondary: #1b2b33;
      --fc-monarch-secondary-foreground: #edf5f7;
      --fc-monarch-tertiary: #52d6cd;
      --fc-monarch-tertiary-foreground: #082a2b;
      --fc-monarch-background: #142027;
      --fc-monarch-foreground: #edf5f7;
      --fc-monarch-faint-foreground: #a6bbc3;
      --fc-monarch-muted-foreground: #a6bbc3;
      --fc-monarch-border: #30434c;
      --fc-monarch-strong-border: #49606a;
      --fc-monarch-faint: #edf5f70d;
      --fc-monarch-muted: #edf5f718;
      --fc-monarch-strong: #edf5f740;
      --fc-monarch-stronger: #edf5f759;
      --fc-monarch-strongest: #edf5f770;
      --fc-monarch-popover: #1b2b33;
      --fc-monarch-highlight: #193b40;
      --fc-monarch-now: #ff7d91;
      --fc-monarch-outline: #8dece4;
      --fc-monarch-selected: #52d6cd;
      --fc-monarch-selected-foreground: #082a2b;
      --fc-monarch-selected-over: #68e0d8;
      --fc-monarch-selected-down: #46c4bc;
    }
    .app-btn{box-sizing:border-box;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/20px Manrope,ui-sans-serif,system-ui,sans-serif;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s;cursor:pointer}
    .app-btn[hidden]{display:none}
    .app-btn:focus-visible,.app-icon-btn:focus-visible{outline:2px solid #8dece4;outline-offset:2px}.app-btn:disabled{opacity:.6;cursor:not-allowed}
    .app-btn-primary{background:#52d6cd;color:#082a2b}.app-btn-primary:hover{background:#74e4da}
    .app-btn-secondary{background:#1b2b33;border-color:#49606a;color:#edf5f7}.app-btn-secondary:hover{background:#223a43}
    .app-btn-tertiary{color:#a6bbc3}.app-btn-tertiary:hover{background:#223a43;color:#edf5f7}
    .app-btn-danger{background:#38252c;border-color:#875061;color:#ffb8c4}.app-btn-danger:hover{background:#492d36}
    .app-icon-btn{box-sizing:border-box;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #49606a;border-radius:10px;background:#1b2b33;color:#edf5f7}
    #menu-toggle[aria-expanded="true"] .menu-icon-open{display:none}#menu-toggle[aria-expanded="true"] .menu-icon-close{display:block}
    #sidebar-toggle{position:fixed;z-index:60;top:28px;left:222px;width:36px;height:36px;padding:0;border-radius:9999px;box-shadow:0 4px 14px #0005}
    #sidebar-tooltip{position:fixed;z-index:1000;max-width:min(240px,calc(100vw - 24px));padding:7px 10px;border:1px solid #49606a;border-radius:8px;background:#1b2b33;color:#edf5f7;font:600 12px/16px Manrope,ui-sans-serif,system-ui,sans-serif;white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px #0006}
    #sidebar-tooltip[hidden]{display:none}
    #app-shell{transition:grid-template-columns 220ms cubic-bezier(.2,.8,.2,1)}
    #desktop-sidebar{transition:padding 220ms cubic-bezier(.2,.8,.2,1),gap 220ms cubic-bezier(.2,.8,.2,1)}
    .brand-mark{transition:width 220ms cubic-bezier(.2,.8,.2,1),height 220ms cubic-bezier(.2,.8,.2,1)}
    .sidebar-label:not(.brand-copy),.brand-copy{max-width:220px;opacity:1;overflow:hidden;transition:max-width 200ms cubic-bezier(.2,.8,.2,1),opacity 140ms ease}
    .sidebar-label:not(.brand-copy){display:inline-block;white-space:nowrap}
    #sidebar-toggle{transition:left 220ms cubic-bezier(.2,.8,.2,1)}
    #sidebar-toggle svg{transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
    @media (prefers-reduced-motion:reduce){ #app-shell,#desktop-sidebar,.brand-mark,.sidebar-label,.brand-copy,#sidebar-toggle,#sidebar-toggle svg{transition:none!important} }
    @media (min-width:1024px){
      #sidebar-toggle{left:calc(240px - 18px)}
      html[data-sidebar-collapsed="true"] #sidebar-toggle{left:calc(76px - 18px)}
      html[data-sidebar-collapsed="true"] #app-shell{grid-template-columns:76px minmax(0,1fr)}
      html[data-sidebar-collapsed="true"] #app-shell aside{align-items:center;gap:16px;padding-inline:12px}
      html[data-sidebar-collapsed="true"] #app-shell .brand-header{justify-content:center}
      html[data-sidebar-collapsed="true"] #app-shell .sidebar-label:not(.brand-copy),html[data-sidebar-collapsed="true"] #app-shell .brand-copy{max-width:0;opacity:0}
      html[data-sidebar-collapsed="true"] #app-shell aside section{display:none}
      html[data-sidebar-collapsed="true"] #app-shell #mobile-menu{width:100%;align-items:center}
      html[data-sidebar-collapsed="true"] #app-shell nav{width:auto;align-items:center}
      html[data-sidebar-collapsed="true"] #app-shell nav a,html[data-sidebar-collapsed="true"] #app-shell form button{position:relative;width:44px;min-width:44px;height:44px;justify-content:center;gap:0;padding:0}
      html[data-sidebar-collapsed="true"] #app-shell form{width:auto}
      html[data-sidebar-collapsed="true"] #app-shell .brand-mark{width:44px;height:44px}
      html[data-sidebar-collapsed="true"] #sidebar-toggle svg{transform:rotate(180deg)}
    }

    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #8dece4;outline-offset:2px}
    #calendar button { min-width:44px; min-height:44px; padding-inline:16px; border-radius:10px; font:600 14px/20px Manrope,ui-sans-serif,system-ui,sans-serif; }
    #calendar button[aria-label*="Anterior"],#calendar button[aria-label*="Próximo"]{width:44px;min-width:44px;padding-inline:0}
    #calendar :focus-visible { outline: 2px solid #8dece4; outline-offset: 2px; }
    #calendar-section.calendar-list-view [role="button"] > div:last-child > div:last-child {
      min-width: max-content;
      white-space: nowrap;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0b1418] font-sans text-[#edf5f7] antialiased selection:bg-[#52d6cd]/20 selection:text-[#edf5f7]">
  <a href="#calendar-section" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[100] focus:rounded-lg focus:bg-[#52d6cd] focus:px-4 focus:py-3 focus:text-sm focus:font-semibold focus:text-[#082a2b]">Pular para o calendário</a>
  <div id="app-shell" data-sidebar-collapsed="false" class="min-h-screen lg:grid lg:grid-cols-[240px_minmax(0,1fr)]">
    <aside id="desktop-sidebar" class="flex flex-col gap-4 bg-[#102329] px-4 py-4 text-[#edf5f7] sm:px-5 lg:sticky lg:top-0 lg:h-screen lg:overflow-y-auto lg:px-5 lg:py-6">
      <div class="brand-header flex items-center justify-between">
        <div>
          <div class="brand-lockup flex items-center gap-2"><div aria-hidden="true" class="brand-mark grid h-10 w-10 shrink-0 grid-cols-3 gap-1 rounded-[10px] border border-[#30434c] bg-[#0b1418] p-1.5"><span class="rounded-sm bg-[#52d6cd]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#74e4da]"></span><span class="rounded-sm bg-[#52d6cd]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#74e4da]"></span></div><div class="brand-copy sidebar-label flex min-w-0 flex-col"><h1 class="text-[25px] font-extrabold leading-8 tracking-tight lg:text-[20px] lg:leading-6">WeCal</h1><p class="whitespace-nowrap text-[11px] leading-4 text-[#a6bbc3] lg:text-[10px]">Sua agenda a dois</p></div></div>
        </div>
        <button id="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-menu" class="app-icon-btn hover:bg-[#223a43] lg:hidden">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon-open h-5 w-5"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon-close h-5 w-5 hidden"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>

      </div>
<div id="mobile-menu" class="hidden flex-col gap-5 lg:flex lg:flex-1">
        <nav aria-label="Navegação principal" class="flex flex-col items-stretch gap-2">
          <a href="#calendar-section" aria-current="page" class="inline-flex min-h-11 items-center gap-3 rounded-xl bg-white/10 px-3 text-sm font-semibold text-[#edf5f7] ring-1 ring-inset ring-white/15 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8dece4]" aria-label="Calendário" data-tooltip="Calendário">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg><span class="sidebar-label">Calendário</span></a>
          <a href="/settings" class="inline-flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm font-medium text-[#a6bbc3] transition-colors hover:bg-[#223a43] hover:text-[#edf5f7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8dece4]" aria-label="Conexões" data-tooltip="Conexões">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg><span class="sidebar-label">Conexões</span></a>
          <a href="/import" class="inline-flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm font-medium text-[#a6bbc3] transition-colors hover:bg-[#223a43] hover:text-[#edf5f7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8dece4]" aria-label="Importar agenda" data-tooltip="Importar agenda">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span class="sidebar-label">Importar agenda</span></a>
          <button id="install-app" type="button" hidden class="app-btn app-btn-secondary w-full justify-start">Instalar aplicativo</button>
          <p id="install-ios-help" hidden class="text-sm text-[#a6bbc3]">No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.</p>
        </nav>

        <section aria-label="Agendas conectadas">
          <h2 class="mb-3 text-xs font-bold uppercase tracking-[0.12em] text-[#a6bbc3]">Agendas</h2>
          <ul class="space-y-3 text-sm">
            {% for calendar in calendars %}
            <li class="flex min-w-0 items-center gap-2.5 text-[#edf5f7]"><span aria-hidden="true" class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:{{ calendar.color }}"></span><span class="min-w-0 truncate" title="{{ calendar.name }}">{{ calendar.name }}</span></li>
            {% endfor %}
            <li class="flex items-center gap-2.5 text-[#a6bbc3]"><span aria-hidden="true" class="h-2.5 w-2.5 shrink-0 rounded-full bg-[#91a9ae]"></span>Privado</li>
          </ul>
        </section>

        <form method="post" action="/logout" class="lg:mt-auto">
          <button aria-label="Sair" data-tooltip="Sair" class="app-btn app-btn-tertiary w-full justify-start text-left"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg><span class="sidebar-label">Sair</span></button>
        </form>
      </div>
    </aside>
    <button id="sidebar-toggle" type="button" aria-label="Recolher menu lateral" aria-expanded="true" aria-controls="desktop-sidebar" class="app-icon-btn hidden lg:inline-flex"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="m15 18-6-6 6-6"/></svg></button>
        <main id="main-content" class="min-w-0 px-3 py-5 sm:px-5 sm:py-6 lg:px-6 lg:py-6">
      <!-- Calendário FullCalendar -->
      <section id="calendar-section" class="scroll-mt-6 overflow-x-auto rounded-2xl border border-[#30434c] bg-[#142027] p-3 shadow-lg shadow-black/20 sm:p-5" tabindex="0" aria-label="Calendário da agenda">
        <div id="calendar"></div>
      </section>
    </main>
  </div>

  <div id="sidebar-tooltip" role="tooltip" hidden></div>

  <!-- Popover de detalhes do evento -->
  <div id="event-popover"
       class="hidden fixed z-50 w-80 max-w-[calc(100vw-1.5rem)] max-h-[calc(100vh-1rem)] overflow-y-auto rounded-xl border border-[#30434c] bg-[#1b2b33] p-4 text-sm text-[#edf5f7] shadow-xl shadow-black/30">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Popover DEVE existir antes do render: datesSet dispara durante render()
      var popover = document.getElementById('event-popover');
      var compact = window.matchMedia('(max-width: 767px)').matches;
      var calendarSection = document.getElementById('calendar-section');
      var menuToggle = document.getElementById('menu-toggle');
      var mobileMenu = document.getElementById('mobile-menu');

      function setMobileMenuOpen(open, returnFocus) {
        mobileMenu.classList.toggle('hidden', !open);
      mobileMenu.classList.toggle('flex', open);
        menuToggle.setAttribute('aria-expanded', String(open));
        menuToggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
        if (!open && returnFocus) menuToggle.focus();
      }

      menuToggle.addEventListener('click', function () {
        setMobileMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true', false);
      });
      mobileMenu.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('a[href="#calendar-section"]')) {
          setMobileMenuOpen(false, false);
          document.getElementById('calendar-section').focus();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
          setMobileMenuOpen(false, true);
        }
      });

      var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        locale: 'pt-br',
        firstDay: 0,
        height: 'auto',
        nowIndicator: true,
        initialView: compact ? 'timeGridDay' : 'timeGridWeek',
        slotMinTime: '07:00:00',
        slotMaxTime: '20:00:00',
        slotLabelContent: function (arg) {
          return arg.text || (arg.date.getHours() === 7 ? '07' : '');
        },
        views: compact ? {
          listWeek: { titleFormat: { month: 'long', year: 'numeric' } }
        } : {},
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: compact ? 'timeGridWeek,timeGridDay,listWeek' : 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        viewDidMount: function (info) {
          calendarSection.classList.toggle('calendar-list-view', info.view.type === 'listWeek');
        },
        // JSON feed do Axum — ?start=&end= são enviados automaticamente
        events: '/api/events',
        // Cores por proveniência/estado — FullCalendar v7 usa `color`
        // (alimenta --fc-event-color: dot + fundo a 15% + borda)
        eventDataTransform: function (ev) {
          ev.extendedProps = {
            source: ev.source || '',
            calendar_name: ev.calendar_name || '',
            calendar_color: ev.calendar_color || '',
            is_private: !!ev.is_private,
            description: ev.description || ''
          };
          if (ev.extendedProps.is_private) ev.title = 'Privado · ' + ev.title;
          if (ev.extendedProps.source === 'Import' && ev.calendar_color) {
            ev.color = ev.calendar_color;
            ev.textColor = contrastText(ev.calendar_color);
          } else if (ev.extendedProps.is_private) {
            ev.color = '#64748b';
          } else if (ev.extendedProps.source === 'Apple') {
            ev.color = '#6366f1';
          } else {
            ev.color = '#8b5cf6';
          }
          ev.contrastColor = ev.textColor || '#ffffff';
          return ev;
        },
        eventClick: function (info) {
          info.jsEvent.preventDefault();
          info.jsEvent.stopPropagation(); // impede o listener global de fechar na hora
          showPopover(info.event, info.jsEvent);
        },
        datesSet: function () { hidePopover(); }
      });
      calendar.render();
      var touchStart = null;
      calendarSection.addEventListener('touchstart', function (event) {
        if (event.touches.length !== 1 || event.target.closest('button, a, input, select, textarea')) {
          touchStart = null;
          return;
        }
        touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }, { passive: true });
      calendarSection.addEventListener('touchend', function (event) {
        if (!touchStart || event.changedTouches.length !== 1) return;
        var dx = event.changedTouches[0].clientX - touchStart.x;
        var dy = event.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          if (dx < 0) calendar.next(); else calendar.prev();
        }
      }, { passive: true });
      calendarSection.addEventListener('touchcancel', function () { touchStart = null; }, { passive: true });

      var installButton = document.getElementById('install-app');
      var installPrompt = null;
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
      });
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone) {
        installButton.hidden = false;
      }
      installButton.addEventListener('click', async function () {
        if (!installPrompt) {
          document.getElementById('install-ios-help').hidden = false;
          return;
        }
        await installPrompt.prompt();
        installPrompt = null;
        installButton.hidden = true;
      });
      window.addEventListener('appinstalled', function () { installButton.hidden = true; });
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var appShell = document.getElementById('app-shell');
      const initialCollapsed = document.documentElement.dataset.sidebarCollapsed === 'true';
      appShell.setAttribute('data-sidebar-collapsed', String(initialCollapsed));
      sidebarToggle.setAttribute('aria-expanded', String(!initialCollapsed));
      sidebarToggle.setAttribute('aria-label', initialCollapsed ? 'Expandir menu lateral' : 'Recolher menu lateral');

      const sidebarTooltip = document.getElementById('sidebar-tooltip');
      const sidebarItems = document.querySelectorAll('#desktop-sidebar [data-tooltip]');
      let activeSidebarItem = null;
      function positionSidebarTooltip() {
        if (!activeSidebarItem) {
          sidebarTooltip.hidden = true;
          return;
        }
        if (appShell.getAttribute('data-sidebar-collapsed') !== 'true' || window.innerWidth < 1024) {
          activeSidebarItem.removeAttribute('aria-describedby');
          activeSidebarItem = null;
          sidebarTooltip.hidden = true;
          return;
        }
        sidebarTooltip.textContent = activeSidebarItem.dataset.tooltip;
        sidebarTooltip.hidden = false;
        const target = activeSidebarItem.getBoundingClientRect();
        const tip = sidebarTooltip.getBoundingClientRect();
        sidebarTooltip.style.left = Math.max(8, Math.min(target.right + 8, window.innerWidth - tip.width - 8)) + 'px';
        sidebarTooltip.style.top = Math.max(8, Math.min(target.top + target.height / 2 - tip.height / 2, window.innerHeight - tip.height - 8)) + 'px';
      }
      function showSidebarTooltip(item) {
        if (appShell.getAttribute('data-sidebar-collapsed') !== 'true' || window.innerWidth < 1024) return;
        if (activeSidebarItem && activeSidebarItem !== item) activeSidebarItem.removeAttribute('aria-describedby');
        activeSidebarItem = item;
        item.setAttribute('aria-describedby', 'sidebar-tooltip');
        positionSidebarTooltip();
      }
      function hideSidebarTooltip(item) {
        if (item.matches(':hover') || document.activeElement === item) return;
        item.removeAttribute('aria-describedby');
        if (activeSidebarItem === item) {
          activeSidebarItem = null;
          sidebarTooltip.hidden = true;
        }
      }
      sidebarItems.forEach(item => {
        item.addEventListener('pointerenter', () => showSidebarTooltip(item));
        item.addEventListener('pointerleave', () => hideSidebarTooltip(item));
        item.addEventListener('focus', () => showSidebarTooltip(item));
        item.addEventListener('blur', () => hideSidebarTooltip(item));
      });
      window.addEventListener('resize', positionSidebarTooltip);
      document.getElementById('desktop-sidebar').addEventListener('scroll', positionSidebarTooltip);
      sidebarToggle.addEventListener('click', function () {
        var collapsed = appShell.getAttribute('data-sidebar-collapsed') !== 'true';
        appShell.setAttribute('data-sidebar-collapsed', String(collapsed));
      document.documentElement.dataset.sidebarCollapsed = String(collapsed);
      try { localStorage.setItem('wecal-sidebar-collapsed', String(collapsed)); } catch (_) {}
      if (!collapsed && activeSidebarItem) { activeSidebarItem.removeAttribute('aria-describedby'); activeSidebarItem = null; sidebarTooltip.hidden = true; }
        sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
        var label = collapsed ? 'Expandir menu lateral' : 'Recolher menu lateral';
        sidebarToggle.setAttribute('aria-label', label);
          window.dispatchEvent(new Event('resize'));
      });
      appShell.addEventListener('transitionend', function (event) {
        if (event.target === appShell && event.propertyName === 'grid-template-columns') window.dispatchEvent(new Event('resize'));
      });


      // ---------- Popover de detalhes ----------
      function showPopover(event, jsEvent) {
        var p = event.extendedProps;
        while (popover.firstChild) popover.removeChild(popover.firstChild);

        var title = el('div', 'font-semibold text-[#edf5f7] leading-snug', event.title);
        var when = el('div', 'text-xs text-[#a6bbc3] mt-1', fmtRange(event.start, event.end));
        popover.appendChild(title);
        popover.appendChild(when);

        var badges = el('div', 'flex flex-wrap gap-1.5 mt-2');
        if (p.source === 'Import') {
          var calendarBadge = badge(p.calendar_name || 'Agenda importada', 'bg-[#142027] text-[#edf5f7] border-[#30434c]');
          if (p.calendar_color) {
            calendarBadge.style.backgroundColor = p.calendar_color;
            calendarBadge.style.borderColor = p.calendar_color;
            calendarBadge.style.color = contrastText(p.calendar_color);
          }
          badges.appendChild(calendarBadge);
        } else {
          var src = p.source === 'Apple'
            ? ['Apple', 'bg-[#182b52] text-[#c8d2ff] border-[#30447a]']
            : ['Google', 'bg-[#35204d] text-[#e5d4ff] border-[#563176]'];
          badges.appendChild(badge(src[0], src[1]));
        }
        if (p.is_private) badges.appendChild(badge('Privado', 'bg-[#223a43] text-[#a6bbc3] border-[#30434c]'));
        popover.appendChild(badges);

        if (p.description) {
          var description = el('p', 'text-[#a6bbc3] mt-2 border-t border-[#30434c] pt-2', p.description);
          description.style.overflowWrap = 'anywhere';
          popover.appendChild(description);
        }

        popover.classList.remove('hidden');
        var x = Math.min(jsEvent.clientX + 14, window.innerWidth - popover.offsetWidth - 10);
        var y = Math.min(jsEvent.clientY + 14, window.innerHeight - popover.offsetHeight - 10);
        popover.style.left = Math.max(8, x) + 'px';
        popover.style.top = Math.max(8, y) + 'px';
      }

      function hidePopover() { if (popover) popover.classList.add('hidden'); }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        e.className = cls;
        e.textContent = text;   // sempre textContent — nada de HTML do banco
        return e;
      }

      function badge(text, cls) {
        return el('span', 'text-[11px] px-2 py-0.5 rounded-full border ' + cls, text);
      }

      function contrastText(color) {
        if (color.startsWith('hsl(')) return '#0f172a';
        var channels = color.slice(1).match(/.{2}/g).map(function (value) {
          var channel = parseInt(value, 16) / 255;
          return channel <= 0.04045 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        });
        return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722 > 0.179
          ? '#0f172a'
          : '#ffffff';
      }

      function fmtRange(start, end) {
        var d = { day: '2-digit', month: '2-digit' };
        var t = { hour: '2-digit', minute: '2-digit' };
        return start.toLocaleDateString('pt-BR', d) + ' · ' +
               start.toLocaleTimeString('pt-BR', t) + ' – ' +
               end.toLocaleTimeString('pt-BR', t);
      }

      document.addEventListener('click', function (e) {
        if (popover.classList.contains('hidden')) return;
        if (e.target.closest && e.target.closest('.fc-event')) return; // clique em evento: já tratado
        if (!popover.contains(e.target)) hidePopover();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hidePopover();
      });
    });
  </script>
</body>
</html>
