{% for o in outcomes %}
  <div role="status" class="flex items-start gap-2 rounded-lg border px-3 py-2
    {% if o.ok %}border-emerald-800 bg-emerald-950/50 text-emerald-300
    {% else %}border-rose-800 bg-rose-950/50 text-rose-300{% endif %}">
    {% if o.ok %}<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>
    {% else %}<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>{% endif %}
    <span class="font-medium">{{ o.provider }}:</span> {{ o.message }}
  </div>
{% endfor %}
{% if outcomes.is_empty() %}
  <p class="text-[#829aa2]">Nenhuma conexão ativa para sincronizar.</p>
{% endif %}
