<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-color-scheme="dark" style="color-scheme: dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b1418"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>WeCal — Acesso</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%23102329'/%3E%3Crect x='4' y='4' width='4' height='4' rx='1' fill='%2352d6cd'/%3E%3Crect x='10' y='4' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='16' y='4' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='4' y='10' width='4' height='4' rx='1' fill='%2374e4da'/%3E%3Crect x='10' y='10' width='4' height='4' rx='1' fill='%2352d6cd'/%3E%3Crect x='16' y='10' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='4' y='16' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='10' y='16' width='4' height='4' rx='1' fill='%2330434c'/%3E%3Crect x='16' y='16' width='4' height='4' rx='1' fill='%2374e4da'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .app-btn{box-sizing:border-box;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/20px Manrope,ui-sans-serif,system-ui,sans-serif;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s;cursor:pointer}
    .app-btn-primary{background:#52d6cd;color:#082a2b}.app-btn-primary:hover{background:#74e4da}
    .app-btn:focus-visible{outline:2px solid #8dece4;outline-offset:2px}
    button:focus-visible,input:focus-visible{outline:2px solid #8dece4;outline-offset:2px}
  </style>
</head>
<body class="min-h-screen bg-[#0b1418] font-sans text-[#edf5f7] antialiased" style="font-family:Manrope,ui-sans-serif,system-ui,sans-serif">
  <main class="grid min-h-screen place-items-center px-4 py-10">
    <section class="w-full max-w-[420px] rounded-2xl border border-[#30434c] bg-[#142027] p-5 sm:p-8">
      <div class="mb-7 flex items-center gap-3">
        <div aria-hidden="true" class="grid h-10 w-10 shrink-0 grid-cols-3 gap-1 rounded-[10px] border border-[#30434c] bg-[#0b1418] p-1.5"><span class="rounded-sm bg-[#52d6cd]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#74e4da]"></span><span class="rounded-sm bg-[#52d6cd]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#30434c]"></span><span class="rounded-sm bg-[#74e4da]"></span></div>
        <div>
          <p class="text-sm font-semibold tracking-wide text-[#edf5f7]">WeCal</p>
          <p class="text-xs text-[#a6bbc3]">Sua agenda a dois</p>
        </div>
      </div>

      <form class="mt-7 space-y-5" method="post" action="/login">
        <div>
          <label class="mb-2 flex items-center gap-2 text-sm font-semibold text-[#edf5f7]" for="access_key">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
            Chave de acesso
          </label>
          <input class="min-h-12 w-full rounded-[10px] border border-[#49606a] bg-[#102329] px-3 py-3 text-base text-[#edf5f7] outline-none transition focus-visible:border-[#52d6cd] focus-visible:ring-2 focus-visible:ring-[#52d6cd]/30"
                 type="password" id="access_key" name="access_key" required autocomplete="current-password" spellcheck="false"/>
        </div>
        {% if let Some(message) = error %}
          <p class="text-sm text-[#ffb8c4]" role="alert">{{ message }}</p>
        {% endif %}
        <button class="app-btn app-btn-primary w-full">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
          Entrar
        </button>
      </form>
    </section>
  </main>
</body>
</html>
